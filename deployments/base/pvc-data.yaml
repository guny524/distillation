# Export storage: a plain PVC — the storage backend (NFS, local-path, Ceph, ...)
# is the cluster's default StorageClass's concern, not this repo's.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-distillation-data
  namespace: distillation
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
