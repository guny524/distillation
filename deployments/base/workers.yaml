apiVersion: apps/v1
kind: Deployment
metadata:
  name: distill-answer
  namespace: distillation
  labels:
    app: distill-answer
    stage: answer
    component: worker
spec:
  # answer is the natural scale-out point: it is the paced teacher stage and often
  # the throughput bottleneck. Raise replicas to run several in parallel -- they
  # serialize their pacing decisions through a Postgres advisory lock and fence
  # their claims by POD_NAME, so quota is never double-spent (todos hardening #1/#6).
  replicas: 1
  selector:
    matchLabels:
      app: distill-answer
  template:
    metadata:
      labels:
        app: distill-answer
        stage: answer
    spec:
      initContainers:
      # Wait until the migrate Job created the schema (see comprehend for detail).
      - name: wait-for-schema
        image: postgres:15-alpine
        envFrom:
        - secretRef:
            name: secret-postgres
        command:
        - sh
        - -c
        - |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          until psql -h svc-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select to_regclass('public.distillation_items')" | grep -q distillation_items; do
            echo "waiting for schema (migrate job)"; sleep 2
          done
      containers:
      - name: answer
        image: distillation:latest
        command:
        - distill
        - answer
        - --loop
        envFrom:
        - secretRef:
            name: secret-postgres
        env:
        - name: POSTGRES_HOST
          value: svc-postgres
        - name: POSTGRES_DB
          value: distillation
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SUBGATE_ENDPOINT_TEACHER
          value: ""
        - name: SUBGATE_ENDPOINT_GENERATOR
          value: ""
        - name: SUBGATE_ENDPOINT_STUDENT
          value: ""
        - name: SUBGATE_ENDPOINT_JUDGE
          value: ""
        - name: SUBGATE_ENDPOINT_TRANSLATOR
          value: ""
        - name: SUBGATE_ENDPOINT_VERIFIER
          value: ""
        volumeMounts:
        - name: prompt
          mountPath: /workspace/prompts/distillation_api.md
          subPath: distillation_api.md
